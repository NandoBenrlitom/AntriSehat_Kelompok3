services:
  app:
    image: ${DOCKERHUB_USER}/antrisehat:latest
    container_name: antrisehat-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend

  scheduler:
    image: ${DOCKERHUB_USER}/antrisehat:latest
    container_name: antrisehat-scheduler
    restart: unless-stopped
    command: ["python", "scheduler.py"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend

  db:
    image: postgres:15-alpine
    container_name: antrisehat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-docker
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - frontend
    profiles:
      - ci

networks:
  frontend:
  backend:
    internal: true

volumes:
  pg_data:
  jenkins_home:
    external: true